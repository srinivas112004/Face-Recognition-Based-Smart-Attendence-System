<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <style>
        :root {
            --primary-color: #6C5CE7;
            --secondary-color: #A29BFE;
            --accent-color: #FD79A8;
            --success-color: #00B894;
            --warning-color: #FDCB6E;
            --danger-color: #E17055;
            --dark-color: #2D3436;
            --light-color: #DDD6FE;
            --background-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--background-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Dark Mode */
        body.dark-mode {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f1f5f9;
        }

        body.dark-mode .login-card {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }

        body.dark-mode .form-control {
            background: #0f172a;
            border-color: #334155;
            color: #f8fafc;
        }

        body.dark-mode .input-group-text {
            background: #1e293b;
            border-color: #334155;
            color: #94a3b8;
        }

        body.dark-mode .role-tab {
            background: #1e293b;
            color: #94a3b8;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><defs><radialGradient id="a" cx="50%" cy="50%"><stop offset="0%" stop-color="%23ffffff" stop-opacity="0.1"/><stop offset="100%" stop-color="%23ffffff" stop-opacity="0"/></radialGradient></defs><circle cx="200" cy="200" r="150" fill="url(%23a)"/><circle cx="800" cy="300" r="100" fill="url(%23a)"/><circle cx="600" cy="700" r="120" fill="url(%23a)"/><circle cx="300" cy="800" r="80" fill="url(%23a)"/></svg>') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            padding: 2.25rem;
            width: 100%;
            max-width: 460px;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: fadeInUp 0.6s ease-out;
        }

        .login-logo {
            width: 65px;
            height: 65px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            margin: 0 auto 1rem;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.35);
        }

        /* Role Switcher Pills */
        .role-switcher {
            display: flex;
            background: #f1f2f6;
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        .role-tab {
            flex: 1;
            padding: 0.65rem 0.5rem;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            color: #636e72;
            border: none;
            background: transparent;
        }

        .role-tab.active {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
        }

        .form-control-custom {
            border: 2px solid rgba(108, 92, 231, 0.2);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control-custom:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(108, 92, 231, 0.25);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            padding: 0.85rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(108, 92, 231, 0.4);
            color: white;
        }

        .theme-pill {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 0.4rem 0.9rem;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .theme-pill:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <title>Sign In - {{ org_name }}</title>
</head>

<body>
    <!-- Theme Toggle Pill -->
    <button class="theme-pill" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
        <i class="fas fa-moon me-1" id="themeIcon"></i>
        <span id="themeText">Dark</span>
    </button>

    <div class="login-card">
        <div class="text-center mb-3">
            <div class="login-logo" id="headerLogo">
                <i class="fas fa-user-shield" id="headerIcon"></i>
            </div>
            <h3 class="fw-bold mb-1" id="headerTitle">Portal Sign In</h3>
            <p class="text-muted small mb-0">{{ org_name }} Smart Attendance</p>
        </div>

        <!-- Role Switcher -->
        <div class="role-switcher">
            <button type="button" class="role-tab active" id="tabAdmin" onclick="selectRole('admin')">
                <i class="fas fa-user-shield me-1"></i> Admin
            </button>
            <button type="button" class="role-tab" id="tabUser" onclick="selectRole('user')">
                <i class="fas fa-user-graduate me-1"></i> Student / User
            </button>
        </div>

        <!-- Flashed Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show small py-2" role="alert">
                        <i class="fas fa-{{ 'exclamation-circle' if category == 'error' else 'info-circle' }} me-1"></i>
                        {{ message }}
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
            <input type="hidden" name="login_type" id="loginTypeInput" value="admin">

            <div class="mb-3">
                <label class="form-label fw-semibold small text-muted" id="userLabel">
                    <i class="fas fa-user me-1 text-primary"></i>Username
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="fas fa-user text-muted" id="userFieldIcon"></i>
                    </span>
                    <input type="text" name="username" id="usernameInput" class="form-control form-control-custom border-start-0" 
                           placeholder="Enter admin username" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold small text-muted">
                    <i class="fas fa-lock me-1 text-primary"></i>Password
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="fas fa-lock text-muted"></i>
                    </span>
                    <input type="password" name="password" id="passwordInput" 
                           class="form-control form-control-custom border-start-0 border-end-0" 
                           placeholder="Enter password" required>
                    <button class="btn btn-outline-secondary border-start-0 bg-light" type="button" onclick="togglePasswordVisibility()">
                        <i class="fas fa-eye text-muted" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-login" id="submitBtn">
                    <i class="fas fa-sign-in-alt me-2"></i>Sign In as Admin
                </button>
            </div>

            <!-- Credentials Hint -->
            <div class="p-2 bg-light rounded text-center small mb-3 border" id="hintBox">
                <i class="fas fa-info-circle me-1 text-primary"></i>Admin default: <strong>admin</strong> / <strong>admin123</strong>
            </div>

            <div class="text-center">
                <a href="/" class="text-decoration-none small text-muted">
                    <i class="fas fa-arrow-left me-1"></i>Return to Public Dashboard
                </a>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Role Selection (Admin vs Student / User)
        function selectRole(role) {
            const loginTypeInput = document.getElementById('loginTypeInput');
            const tabAdmin = document.getElementById('tabAdmin');
            const tabUser = document.getElementById('tabUser');
            const userLabel = document.getElementById('userLabel');
            const usernameInput = document.getElementById('usernameInput');
            const headerIcon = document.getElementById('headerIcon');
            const submitBtn = document.getElementById('submitBtn');
            const hintBox = document.getElementById('hintBox');

            loginTypeInput.value = role;

            if (role === 'admin') {
                tabAdmin.classList.add('active');
                tabUser.classList.remove('active');
                headerIcon.className = 'fas fa-user-shield';
                userLabel.innerHTML = '<i class="fas fa-user me-1 text-primary"></i>Admin Username';
                usernameInput.placeholder = 'Enter admin username (e.g. admin)';
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Sign In as Admin';
                hintBox.innerHTML = '<i class="fas fa-info-circle me-1 text-primary"></i>Admin default: <strong>admin</strong> / <strong>admin123</strong>';
            } else {
                tabUser.classList.add('active');
                tabAdmin.classList.remove('active');
                headerIcon.className = 'fas fa-user-graduate';
                userLabel.innerHTML = '<i class="fas fa-id-badge me-1 text-primary"></i>Student / User ID (Roll No)';
                usernameInput.placeholder = 'Enter your User ID (e.g. 1, 10, 101)';
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Sign In as Student';
                hintBox.innerHTML = '<i class="fas fa-info-circle me-1 text-primary"></i>Student default: Password is your <strong>User ID</strong> or <strong>user123</strong>';
            }
        }

        // Password Visibility Toggle
        function togglePasswordVisibility() {
            const pwd = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'fas fa-eye-slash text-muted';
            } else {
                pwd.type = 'password';
                icon.className = 'fas fa-eye text-muted';
            }
        }

        // Theme Toggle
        const currentTheme = localStorage.getItem('faceattend_theme') || 'light';
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeIcon').className = 'fas fa-sun me-1 text-warning';
            document.getElementById('themeText').textContent = 'Light';
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('faceattend_theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').className = isDark ? 'fas fa-sun me-1 text-warning' : 'fas fa-moon me-1';
            document.getElementById('themeText').textContent = isDark ? 'Light' : 'Dark';
        }
    </script>
</body>

</html>
